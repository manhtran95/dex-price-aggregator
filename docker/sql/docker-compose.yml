services:
  db:
    image: postgres:16-alpine
    container_name: aggregator-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=aggregator
      - POSTGRES_PASSWORD=aggregator_password
      - POSTGRES_DB=aggregator_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator -d aggregator_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: aggregator-postgres-data
    driver: local